name: Deploy Backend (Koyeb)

# Redeploys the Medusa backend to Koyeb ONLY after CI has passed on main.
# Koyeb rebuilds from the connected Git repo using apps/backend/Dockerfile, so
# this step just tells Koyeb to pull the latest main and redeploy.
#
# Required repo settings (Settings → Secrets and variables → Actions):
#   Secret   KOYEB_TOKEN    — a Koyeb API access token
#   Variable KOYEB_APP      — the Koyeb app name (e.g. "mithra")
#   Variable KOYEB_SERVICE  — the service name (e.g. "backend")
#
# NOTE: disable Koyeb's own "auto-deploy on push" for this service so deploys
# are always gated on CI here (otherwise it deploys twice, one of them ungated).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow manual redeploys from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Redeploy on Koyeb
    runs-on: ubuntu-latest
    # For workflow_run: only deploy when CI succeeded. workflow_dispatch has no
    # workflow_run payload, so the conclusion check is skipped for manual runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Install Koyeb CLI
        uses: koyeb/install-cli@v2

      - name: Redeploy service
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "::error::KOYEB_TOKEN secret is not set — add it in repo settings."
            exit 1
          fi
          koyeb services redeploy "${{ vars.KOYEB_APP }}/${{ vars.KOYEB_SERVICE }}" --token "$KOYEB_TOKEN"
